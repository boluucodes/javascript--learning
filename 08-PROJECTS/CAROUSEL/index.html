<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAROUSELS</title>
    <link rel="stylesheet" href="/08-PROJECTS/CAROUSEL/style.css">
</head>
<body>
    <section class="carousel">

    <div class="carousel-viewport">

        <div class="carousel-track">

            <article class="slide">
                <h2>Slide One</h2>
                <p>This is the first slide.</p>
            </article>

            <article class="slide">
                <h2>Slide Two</h2>
                <p>This is the second slide.</p>
            </article>

            <article class="slide">
                <h2>Slide Three</h2>
                <p>This is the third slide.</p>
            </article>

            <article class="slide">
                <h2>Slide Four</h2>
                <p>This is the fourth slide.</p>
            </article>

        </div>


    </div>

     <div class="carousel-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

</section>
</body>
</html>
