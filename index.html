<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Learning</title>

    <style>

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #f8fafc;

            min-height: 100vh;

            display: flex;
            /* justify-content: center; */
            align-items: center;

            padding: 30px;
        }

        /* Main content */
        body > h1,
        body > p,
        body > h2,
        body > a {
            position: relative;
        }

        body {
            flex-direction: column;
            text-align: center;
        }

        /* Heading */
        h1 {
            font-size: 3rem;
            margin: 25px 0;
            letter-spacing: -1px;
        }

        /* Description */
        p {
            max-width: 600px;

            color: #94a3b8;

            font-size: 1.1rem;

            margin-bottom: 20px;
        }

        /* Projects heading */
        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        /* FizzBuzz link */
        a {
            display: inline-block;
            width: 220px;
            padding: 12px 22px;

            background: #38bdf8;
            color: #0f172a;

            text-decoration: none;

            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 6px;

            transition: all 0.25s ease;
        }

        /* Hover effect */
        a:hover {
            transform: translateY(-3px);

            /* background: #7dd3fc; */

            /* box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25); */
        }

    </style>
</head>

<body>

    <h1>JavaScript Learning</h1>

    <p>
        A collection of my JavaScript exercises, experiments and projects.
    </p>

    <h2>Projects</h2>

    <a href="./08-PROJECTS/Fizzbuzz/">
        FizzBuzz
    </a>
    <a href="./08-PROJECTS/Number Guessing Game/">
        Guessing Game
    </a>
    <a href="./08-PROJECTS/COUNTER/">
        Counter
    </a>

</body>
</html>
